<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>super-nono.cc</title>
<meta name="theme-color" content="#0e0f11">
<!-- PWA : s'ouvre en plein écran comme une application -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="super-nono">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link href="/vendor/mdi/css/materialdesignicons.min.css" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0e0f11;--card:#1c1f25;--border:#2a2d35;
    --accent:#e8c547;--text:#f0ede6;--muted:#6b6f7a;--danger:#e85c47;
    --serif:'DM Serif Display',Georgia,serif;--mono:'DM Mono',ui-monospace,monospace;
  }
  html,body{background:var(--bg);color:var(--text);font-family:var(--mono)}
  body{min-height:100vh;padding:2rem 1rem 4rem;padding-top:calc(2rem + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}

  /* ── HEADER ── */
  .logo{font-family:var(--serif);font-size:2.2rem;color:var(--accent);letter-spacing:-.5px;text-align:center}
  .logo span{color:var(--text);font-style:italic}
  .sub{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:.3rem 0 1.6rem;text-align:center}

  /* ── WIDGETS ── */
  .widgets{display:flex;gap:.75rem;width:100%;max-width:420px;margin-bottom:2rem}
  .widget{flex:1;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:.85rem 1rem;display:flex;align-items:center;gap:.7rem}
  .w-clock .w-time{font-family:var(--serif);font-size:1.5rem;color:var(--accent);line-height:1}
  .w-clock .w-date{font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:.2rem}
  .w-weather .w-emoji{font-size:1.7rem}
  .w-weather .w-temp{font-family:var(--serif);font-size:1.4rem;color:var(--accent);line-height:1}
  .w-weather .w-loc{font-size:.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ── ADMIN BAR ── */
  .adminbar{width:100%;max-width:420px;display:flex;justify-content:flex-end;gap:.6rem;margin-bottom:1rem}
  .lnk{font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;background:none;border:none;transition:color .2s}
  .lnk:hover,.lnk.active{color:var(--accent)}

  /* ── CATEGORIES / SECTIONS ── */
  .wrap{width:100%;max-width:420px;display:flex;flex-direction:column;gap:2rem}
  .cat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem;border-bottom:1px solid var(--border);padding-bottom:.4rem}
  .cat-name{font-family:var(--serif);font-size:1.35rem;color:var(--accent)}
  .sec{margin-bottom:1.2rem}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.55rem}
  .sec-name{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
  .manage-btns{display:flex;gap:.3rem}
  .mbtn{background:var(--bg);border:1px solid var(--border);color:var(--muted);border-radius:5px;font-size:.56rem;padding:.15rem .4rem;font-family:var(--mono);transition:border-color .2s,color .2s;line-height:1.4}
  .mbtn:hover{border-color:var(--accent);color:var(--accent)}
  .mbtn.del:hover{border-color:var(--danger);color:var(--danger)}

  /* ── APP CARDS ── */
  .apps{display:flex;flex-direction:column;gap:.7rem}
  .card{display:flex;align-items:center;gap:1.1rem;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1rem 1.1rem;color:var(--text);transition:border-color .2s,transform .15s,background .2s;position:relative}
  .card:hover{transform:translateY(-2px)}
  .i-emoji{font-size:1.7rem}
  .i-img{width:1.9rem;height:1.9rem;object-fit:contain;border-radius:6px}
  .mdi{font-size:1.7rem;line-height:1}
  .card-icon{flex-shrink:0;width:2.3rem;display:flex;align-items:center;justify-content:center}
  .card-body{flex:1;min-width:0}
  .card-title{font-family:var(--serif);font-size:1.1rem;margin-bottom:.12rem}
  .card-desc{font-size:.62rem;color:var(--muted);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-arrow{flex-shrink:0;color:var(--border);font-size:1rem}

  /* ── SHORTCUTS ── */
  .shortcuts{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:.7rem}
  .chip{display:flex;align-items:center;gap:.5rem;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.5rem .8rem;color:var(--text);transition:border-color .2s,transform .15s;position:relative}
  .chip:hover{transform:translateY(-1px)}
  .chip .i-emoji,.chip .mdi{font-size:1.1rem}
  .chip .i-img{width:1.2rem;height:1.2rem}
  .chip-title{font-size:.75rem}

  .item-actions{position:absolute;top:.35rem;right:.4rem;display:flex;gap:.25rem}
  .card .item-actions{top:.4rem;right:.5rem}

  .empty{font-size:.65rem;color:var(--muted);font-style:italic;padding:.4rem 0}
  .footer{font-size:.55rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:2.5rem}

  /* ── MODAL ── */
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:500;align-items:flex-end;justify-content:center}
  .overlay.open{display:flex}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:440px;padding:1.2rem 1.4rem 2.2rem;max-height:92vh;overflow-y:auto}
  .handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto .9rem}
  .modal-title{font-family:var(--serif);font-size:1.2rem;color:var(--accent);margin-bottom:1.1rem}
  .field{display:flex;flex-direction:column;gap:.25rem;margin-bottom:.8rem}
  .field label{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .field input{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:.82rem;padding:.55rem .75rem;outline:none}
  .field input:focus{border-color:var(--accent)}
  .row{display:flex;gap:.8rem;margin-top:1rem}
  .btn-cancel{flex:1;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;font-family:var(--mono);font-size:.8rem;padding:.7rem}
  .btn-ok{flex:2;background:var(--accent);color:#0e0f11;border:none;border-radius:8px;font-family:var(--mono);font-size:.8rem;font-weight:500;padding:.7rem}
  .btn-ok:hover{opacity:.88}

  /* ── ICON PICKER TABS ── */
  .tabs{display:flex;gap:.4rem;margin-bottom:.6rem}
  .tab{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--muted);border-radius:8px;font-size:.68rem;padding:.45rem;font-family:var(--mono);transition:.15s}
  .tab.active{border-color:var(--accent);color:var(--accent)}
  .tabpane{display:none}.tabpane.active{display:block}
  .icon-preview{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem;font-size:1.6rem;min-height:2rem}
  .icon-preview .i-img{width:1.8rem;height:1.8rem}

  /* Emoji picker */
  .emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:170px;overflow-y:auto;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.4rem}
  .emoji-cats{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;margin-bottom:.3rem}
  .emoji-cats::-webkit-scrollbar{display:none}
  .ecat{background:none;border:none;padding:.3rem .45rem;font-size:.95rem;opacity:.5}
  .ecat.active{opacity:1}
  .eitem{font-size:1.3rem;text-align:center;padding:.2rem;border-radius:6px;cursor:pointer}
  .eitem:hover{background:var(--border)}

  /* Color picker */
  .cp-grad{width:100%;height:130px;border-radius:8px;position:relative;cursor:crosshair;touch-action:none}
  .cp-grad::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent,#000);border-radius:8px;pointer-events:none}
  .cp-cursor{position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #000;transform:translate(-50%,-50%);pointer-events:none;z-index:2}
  .cp-hue{width:100%;height:14px;border-radius:7px;margin-top:.5rem;-webkit-appearance:none;appearance:none;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
  .cp-hue::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #555}
  .cp-bottom{display:flex;align-items:center;gap:.6rem;margin-top:.6rem}
  .cp-swatch{width:30px;height:30px;border-radius:6px;border:1px solid var(--border)}
  .cp-hex-wrap{display:flex;align-items:center;gap:.3rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.3rem .6rem;flex:1}
  .cp-hex{background:none;border:none;color:var(--text);font-family:var(--mono);font-size:.8rem;width:100%;outline:none}
  .cp-presets{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
  .cp-preset{width:22px;height:22px;border-radius:4px;cursor:pointer;border:2px solid transparent}
  .cp-preset.selected{border-color:var(--text)}

  .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(4rem);background:var(--accent);color:#0e0f11;font-size:.75rem;padding:.55rem 1.2rem;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;z-index:600}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="logo" id="logo">super<span>-nono</span></div>
<div class="sub" id="sub">Mon hub central</div>

<div class="widgets">
  <div class="widget w-clock">
    <div>
      <div class="w-time" id="w-time">--:--</div>
      <div class="w-date" id="w-date">—</div>
    </div>
  </div>
  <div class="widget w-weather">
    <div class="w-emoji" id="w-emoji">⏳</div>
    <div>
      <div class="w-temp" id="w-temp">--°</div>
      <div class="w-loc" id="w-loc">—</div>
    </div>
  </div>
</div>

<div class="adminbar">
  <button class="lnk" id="manage-lnk" onclick="toggleManage()" style="display:none">Gérer</button>
  <button class="lnk" id="login-lnk" onclick="openLogin()">Admin</button>
</div>

<div class="wrap" id="wrap"></div>

<div class="footer">super-nono.cc</div>

<!-- ══ MODAL ITEM (app / raccourci) ══ -->
<div class="overlay" id="m-item" onclick="closeOverlay(event,'m-item')">
  <div class="modal">
    <div class="handle"></div>
    <div class="modal-title" id="m-item-title">Ajouter</div>

    <div class="field">
      <label>Icône</label>
      <div class="icon-preview" id="icon-preview"></div>
      <div class="tabs">
        <button class="tab active" data-tab="emoji" onclick="switchIconTab('emoji')">Emoji</button>
        <button class="tab" data-tab="image" onclick="switchIconTab('image')">Logo</button>
        <button class="tab" data-tab="mdi" onclick="switchIconTab('mdi')">MDI</button>
      </div>
      <div class="tabpane active" data-pane="emoji">
        <div class="emoji-cats" id="emoji-cats"></div>
        <div class="emoji-grid" id="emoji-grid"></div>
      </div>
      <div class="tabpane" data-pane="image">
        <input type="file" id="f-file" accept="image/*" onchange="uploadIcon(this)">
        <div style="font-size:.58rem;color:var(--muted);margin-top:.3rem">PNG/SVG carré conseillé (max 2 Mo).</div>
      </div>
      <div class="tabpane" data-pane="mdi">
        <input type="text" id="f-mdi" placeholder="ex : server, home-automation…" oninput="previewMdi(this.value)">
        <div style="font-size:.58rem;color:var(--muted);margin-top:.3rem">Nom d'icône <a href="https://pictogrammers.com/library/mdi/" target="_blank" style="color:var(--accent)">Material Design Icons</a> (sans le préfixe mdi-).</div>
      </div>
    </div>

    <div class="field">
      <label>Nom</label>
      <input type="text" id="f-title" placeholder="Mon app">
    </div>
    <div class="field" id="f-desc-field">
      <label>Description</label>
      <input type="text" id="f-desc" placeholder="Courte description…">
    </div>
    <div class="field">
      <label>Lien (URL)</label>
      <input type="url" id="f-url" placeholder="https://…">
    </div>

    <div class="field">
      <label>Couleur d'accent</label>
      <div class="cp-grad" id="cp-grad"><div class="cp-cursor" id="cp-cursor"></div></div>
      <input type="range" class="cp-hue" id="cp-hue" min="0" max="360" value="45">
      <div class="cp-bottom">
        <div class="cp-swatch" id="cp-swatch"></div>
        <div class="cp-hex-wrap"><span style="color:var(--muted)">#</span><input class="cp-hex" id="cp-hex" maxlength="6" value="e8c547"></div>
      </div>
      <div class="cp-presets" id="cp-presets"></div>
    </div>

    <div class="row">
      <button class="btn-cancel" onclick="closeOverlay(null,'m-item')">Annuler</button>
      <button class="btn-ok" onclick="saveItem()">Enregistrer</button>
    </div>
  </div>
</div>

<!-- ══ MODAL LOGIN ══ -->
<div class="overlay" id="m-login" onclick="closeOverlay(event,'m-login')">
  <div class="modal">
    <div class="handle"></div>
    <div class="modal-title">Connexion admin</div>
    <div class="field">
      <label>Mot de passe</label>
      <input type="password" id="f-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="row">
      <button class="btn-cancel" onclick="closeOverlay(null,'m-login')">Annuler</button>
      <button class="btn-ok" onclick="doLogin()">Se connecter</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── ÉTAT ─────────────────────────────────────────────────────────────────────
let config = { settings:{}, categories:[] };
let manageMode = false;
let token = localStorage.getItem('hub_token') || '';
let editRef = null;   // { catId, secId, itemId|null, type }
let curIcon = { kind:'emoji', value:'🔗' };

const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,5);
function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.style.background=err?'var(--danger)':'var(--accent)';t.style.color=err?'#fff':'#0e0f11';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}

// ─── CHARGEMENT ───────────────────────────────────────────────────────────────
async function init(){
  const cfg = await (await fetch('/api/config')).json();
  config = cfg;
  applySettings();
  render();
  startClock();
  loadWeather();
  if(token) document.getElementById('manage-lnk').style.display='';
}
function applySettings(){
  const s = config.settings||{};
  if(s.title!=null) document.getElementById('logo').innerHTML = esc(s.title)+'<span>'+esc(s.titleAccent||'')+'</span>';
  if(s.subtitle!=null) document.getElementById('sub').textContent = s.subtitle;
}

// ─── ICÔNES ───────────────────────────────────────────────────────────────────
function iconHTML(icon){
  if(!icon) return '';
  if(icon.kind==='image') return `<img class="i-img" src="${esc(icon.value)}" alt="">`;
  if(icon.kind==='mdi') return `<i class="mdi mdi-${esc(icon.value)}"></i>`;
  return `<span class="i-emoji">${esc(icon.value)}</span>`;
}
function actionsHTML(catId,secId,item){
  return `<div class="item-actions">
    <button class="mbtn" onclick="moveItem('${catId}','${secId}','${item.id}',-1);event.preventDefault();event.stopPropagation()">↑</button>
    <button class="mbtn" onclick="moveItem('${catId}','${secId}','${item.id}',1);event.preventDefault();event.stopPropagation()">↓</button>
    <button class="mbtn" onclick="openItem('${catId}','${secId}','${item.id}');event.preventDefault();event.stopPropagation()">✎</button>
    <button class="mbtn del" onclick="deleteItem('${catId}','${secId}','${item.id}');event.preventDefault();event.stopPropagation()">✕</button>
  </div>`;
}

// ─── RENDU ────────────────────────────────────────────────────────────────────
function render(){
  const wrap = document.getElementById('wrap');
  document.getElementById('manage-lnk').classList.toggle('active',manageMode);
  document.getElementById('manage-lnk').textContent = manageMode?'Terminer':'Gérer';
  let html = '';
  config.categories.forEach(cat=>{
    html += `<div class="cat">
      <div class="cat-head">
        <div class="cat-name">${esc(cat.name)}</div>
        ${manageMode?`<div class="manage-btns">
          <button class="mbtn" onclick="moveCat('${cat.id}',-1)">↑</button>
          <button class="mbtn" onclick="moveCat('${cat.id}',1)">↓</button>
          <button class="mbtn" onclick="renameCat('${cat.id}')">✎</button>
          <button class="mbtn del" onclick="deleteCat('${cat.id}')">✕</button>
        </div>`:''}
      </div>`;
    (cat.sections||[]).forEach(sec=>{
      html += `<div class="sec">
        <div class="sec-head">
          <div class="sec-name">${esc(sec.name)}</div>
          ${manageMode?`<div class="manage-btns">
            <button class="mbtn" onclick="openItem('${cat.id}','${sec.id}',null,'app')">+App</button>
            <button class="mbtn" onclick="openItem('${cat.id}','${sec.id}',null,'shortcut')">+Raccourci</button>
            <button class="mbtn" onclick="moveSec('${cat.id}','${sec.id}',-1)">↑</button>
            <button class="mbtn" onclick="moveSec('${cat.id}','${sec.id}',1)">↓</button>
            <button class="mbtn" onclick="renameSec('${cat.id}','${sec.id}')">✎</button>
            <button class="mbtn del" onclick="deleteSec('${cat.id}','${sec.id}')">✕</button>
          </div>`:''}
        </div>`;
      const apps = (sec.items||[]).filter(i=>i.type!=='shortcut');
      const shorts = (sec.items||[]).filter(i=>i.type==='shortcut');
      if(apps.length){
        html += '<div class="apps">';
        apps.forEach(it=>{
          const b=hexA(it.color,.25), bh=hexA(it.color,.6);
          html += `<a class="card" href="${esc(it.url)}" data-nav style="border-color:${b}"
            onmouseover="this.style.borderColor='${bh}'" onmouseout="this.style.borderColor='${b}'"
            ${manageMode?'onclick="return false"':''}>
            ${manageMode?actionsHTML(cat.id,sec.id,it):''}
            <div class="card-icon">${iconHTML(it.icon)}</div>
            <div class="card-body">
              <div class="card-title" style="color:${esc(it.color||'var(--text)')}">${esc(it.title)}</div>
              <div class="card-desc">${esc(it.desc||'')}</div>
            </div>
            <div class="card-arrow">›</div>
          </a>`;
        });
        html += '</div>';
      }
      if(shorts.length){
        html += '<div class="shortcuts">';
        shorts.forEach(it=>{
          const b=hexA(it.color,.35), bh=hexA(it.color,.7);
          html += `<a class="chip" href="${esc(it.url)}" data-nav style="border-color:${b}"
            onmouseover="this.style.borderColor='${bh}'" onmouseout="this.style.borderColor='${b}'"
            ${manageMode?'onclick="return false"':''}>
            ${manageMode?actionsHTML(cat.id,sec.id,it):''}
            <span class="card-icon" style="width:auto">${iconHTML(it.icon)}</span>
            <span class="chip-title">${esc(it.title)}</span>
          </a>`;
        });
        html += '</div>';
      }
      if(!apps.length && !shorts.length) html += '<div class="empty">Vide</div>';
      html += '</div>';
    });
    if(manageMode) html += `<button class="mbtn" onclick="addSec('${cat.id}')">+ Section</button>`;
    html += '</div>';
  });
  if(manageMode) html += `<button class="mbtn" style="align-self:flex-start" onclick="addCat()">+ Catégorie</button>`;
  wrap.innerHTML = html;
}
function hexA(hex,a){hex=(hex||'#e8c547').replace('#','');if(hex.length===3)hex=hex.split('').map(x=>x+x).join('');const r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);return `rgba(${r},${g},${b},${a})`;}

// ─── NAVIGATION PWA (ouvre en plein écran, pas de mini-navigateur iOS) ─────────
document.addEventListener('click',function(e){
  const a = e.target.closest('a[data-nav]');
  if(!a || manageMode) return;
  e.preventDefault();
  window.location.href = a.href;
});

// ─── FIND HELPERS ─────────────────────────────────────────────────────────────
const findCat = id => config.categories.find(c=>c.id===id);
const findSec = (cId,sId) => (findCat(cId)||{}).sections?.find(s=>s.id===sId);

// ─── SAUVEGARDE ───────────────────────────────────────────────────────────────
async function save(){
  const res = await fetch('/api/config',{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(config)});
  if(res.status===401){ toast('Session expirée, reconnecte-toi',true); logout(); openLogin(); return false; }
  if(!res.ok){ toast('Erreur de sauvegarde',true); return false; }
  return true;
}

// ─── CATÉGORIES ───────────────────────────────────────────────────────────────
async function addCat(){const n=prompt('Nom de la catégorie ?');if(!n)return;config.categories.push({id:uid(),name:n.trim(),sections:[]});render();await save();}
async function renameCat(id){const c=findCat(id);const n=prompt('Nouveau nom',c.name);if(!n)return;c.name=n.trim();render();await save();}
async function deleteCat(id){if(!confirm('Supprimer cette catégorie et tout son contenu ?'))return;config.categories=config.categories.filter(c=>c.id!==id);render();await save();}
async function moveCat(id,d){const a=config.categories;const i=a.findIndex(c=>c.id===id);const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];render();await save();}

// ─── SECTIONS ─────────────────────────────────────────────────────────────────
async function addSec(cId){const n=prompt('Nom de la section ?');if(!n)return;findCat(cId).sections.push({id:uid(),name:n.trim(),items:[]});render();await save();}
async function renameSec(cId,sId){const s=findSec(cId,sId);const n=prompt('Nouveau nom',s.name);if(!n)return;s.name=n.trim();render();await save();}
async function deleteSec(cId,sId){if(!confirm('Supprimer cette section ?'))return;const c=findCat(cId);c.sections=c.sections.filter(s=>s.id!==sId);render();await save();}
async function moveSec(cId,sId,d){const a=findCat(cId).sections;const i=a.findIndex(s=>s.id===sId);const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];render();await save();}

// ─── ITEMS ────────────────────────────────────────────────────────────────────
async function moveItem(cId,sId,itId,d){const a=findSec(cId,sId).items;const i=a.findIndex(x=>x.id===itId);const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];render();await save();}
async function deleteItem(cId,sId,itId){if(!confirm('Supprimer cet élément ?'))return;const s=findSec(cId,sId);s.items=s.items.filter(x=>x.id!==itId);render();await save();}

function openItem(cId,sId,itId,type){
  editRef={catId:cId,secId:sId,itemId:itId,type:type};
  const it = itId ? findSec(cId,sId).items.find(x=>x.id===itId) : null;
  if(it) type=it.type;
  editRef.type=type;
  document.getElementById('m-item-title').textContent = (itId?'Modifier ':'Ajouter ')+(type==='shortcut'?'un raccourci':'une app');
  document.getElementById('f-desc-field').style.display = type==='shortcut'?'none':'flex';
  curIcon = it?{...it.icon}:{kind:'emoji',value:'🔗'};
  document.getElementById('f-title').value = it?it.title:'';
  document.getElementById('f-desc').value = it?(it.desc||''):'';
  document.getElementById('f-url').value = it?it.url:'';
  document.getElementById('f-mdi').value = curIcon.kind==='mdi'?curIcon.value:'';
  switchIconTab(curIcon.kind);
  refreshIconPreview();
  setColorHex((it?it.color:'#e8c547').replace('#',''));
  openOverlay('m-item');
}
async function saveItem(){
  const title=document.getElementById('f-title').value.trim();
  let url=document.getElementById('f-url').value.trim();
  if(!title||!url){toast('Nom et lien requis',true);return;}
  if(!/^https?:\/\//i.test(url)) url='https://'+url;
  const data={id:editRef.itemId||uid(),type:editRef.type,icon:curIcon,title,desc:document.getElementById('f-desc').value.trim(),url,color:'#'+document.getElementById('cp-hex').value};
  const sec=findSec(editRef.catId,editRef.secId);
  if(editRef.itemId){const i=sec.items.findIndex(x=>x.id===editRef.itemId);sec.items[i]=data;}
  else sec.items.push(data);
  render();
  if(await save()){closeOverlay(null,'m-item');toast(editRef.itemId?'Modifié ✓':'Ajouté ✓');}
}

// ─── ICON PICKER ──────────────────────────────────────────────────────────────
function switchIconTab(kind){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===kind));
  document.querySelectorAll('.tabpane').forEach(p=>p.classList.toggle('active',p.dataset.pane===kind));
}
function refreshIconPreview(){document.getElementById('icon-preview').innerHTML = iconHTML(curIcon) + '<span style="font-size:.65rem;color:var(--muted)">Aperçu</span>';}
function previewMdi(v){curIcon={kind:'mdi',value:v.trim().replace(/^mdi-/,'')};refreshIconPreview();}
async function uploadIcon(input){
  const f=input.files[0];if(!f)return;
  const fd=new FormData();fd.append('file',f);
  const res=await fetch('/api/upload',{method:'POST',headers:{'Authorization':'Bearer '+token},body:fd});
  const j=await res.json();
  if(!j.ok){toast('Upload échoué',true);return;}
  curIcon={kind:'image',value:j.url};refreshIconPreview();toast('Logo chargé ✓');
}

// ─── COLOR PICKER ─────────────────────────────────────────────────────────────
const PRESETS=['#e8c547','#4fc3a1','#a78bfa','#e87c47','#5bc4e8','#e85c47','#f472b6','#34d399','#60a5fa','#fb923c','#a3e635','#ffffff'];
let cpHue=45,cpSat=70,cpVal=80;
function initCP(){
  const pr=document.getElementById('cp-presets');
  pr.innerHTML=PRESETS.map(p=>`<div class="cp-preset" data-c="${p}" style="background:${p}" onclick="setColorHex('${p.replace('#','')}')"></div>`).join('');
  const grad=document.getElementById('cp-grad');let drag=false;
  function pick(e){const r=grad.getBoundingClientRect();const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;cpSat=Math.max(0,Math.min(100,x/r.width*100));cpVal=Math.max(0,Math.min(100,100-y/r.height*100));fromHSV();}
  grad.addEventListener('mousedown',e=>{drag=true;pick(e);});
  grad.addEventListener('touchstart',e=>{drag=true;pick(e);e.preventDefault();},{passive:false});
  document.addEventListener('mousemove',e=>{if(drag)pick(e);});
  document.addEventListener('touchmove',e=>{if(drag)pick(e);},{passive:false});
  document.addEventListener('mouseup',()=>drag=false);document.addEventListener('touchend',()=>drag=false);
  document.getElementById('cp-hue').addEventListener('input',e=>{cpHue=+e.target.value;fromHSV();});
  document.getElementById('cp-hex').addEventListener('change',e=>setColorHex(e.target.value.replace('#','')));
  fromHSV();
}
function fromHSV(){
  document.getElementById('cp-grad').style.background=`linear-gradient(to right,#fff,hsl(${cpHue},100%,50%))`;
  document.getElementById('cp-cursor').style.left=cpSat+'%';document.getElementById('cp-cursor').style.top=(100-cpVal)+'%';
  const [r,g,b]=hsv2rgb(cpHue,cpSat,cpVal);const hex=rgbHex(r,g,b);
  document.getElementById('cp-hex').value=hex;document.getElementById('cp-swatch').style.background='#'+hex;
  document.querySelectorAll('.cp-preset').forEach(d=>d.classList.toggle('selected',d.dataset.c.toLowerCase().replace('#','')===hex.toLowerCase()));
}
function setColorHex(hex){if(hex.length!==6)return;const r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);[cpHue,cpSat,cpVal]=rgb2hsv(r,g,b);fromHSV();}
function hsv2rgb(h,s,v){s/=100;v/=100;const i=Math.floor(h/60)%6,f=h/60-Math.floor(h/60);const p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);const m=[[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i];return m.map(x=>Math.round(x*255));}
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d+6)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}return [Math.round(h),mx?Math.round(d/mx*100):0,Math.round(mx*100)];}
function rgbHex(r,g,b){return [r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');}

// ─── LOGIN ────────────────────────────────────────────────────────────────────
function openLogin(){openOverlay('m-login');setTimeout(()=>document.getElementById('f-pass').focus(),100);}
async function doLogin(){
  const p=document.getElementById('f-pass').value;
  const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});
  const j=await res.json();
  if(!j.ok){toast(j.error||'Échec',true);return;}
  token=j.token;localStorage.setItem('hub_token',token);
  document.getElementById('f-pass').value='';
  closeOverlay(null,'m-login');
  document.getElementById('manage-lnk').style.display='';
  toggleManage();toast('Connecté ✓');
}
function logout(){token='';localStorage.removeItem('hub_token');manageMode=false;document.getElementById('manage-lnk').style.display='none';render();}
function toggleManage(){if(!token){openLogin();return;}manageMode=!manageMode;render();}

// ─── MODALS ───────────────────────────────────────────────────────────────────
function openOverlay(id){document.getElementById(id).classList.add('open');}
function closeOverlay(e,id){if(e&&e.target!==document.getElementById(id))return;document.getElementById(id).classList.remove('open');}

// ─── WIDGETS ──────────────────────────────────────────────────────────────────
function startClock(){
  const upd=()=>{
    const d=new Date();
    document.getElementById('w-time').textContent=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('w-date').textContent=d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
  };
  upd();setInterval(upd,10000);
}
const WCODE={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',73:'🌨️',75:'❄️',80:'🌦️',81:'🌧️',82:'⛈️',95:'⛈️',96:'⛈️',99:'⛈️'};
async function loadWeather(){
  const w=(config.settings||{}).weather;if(!w){document.getElementById('w-emoji').textContent='—';return;}
  document.getElementById('w-loc').textContent=w.label||'';
  try{
    const r=await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${w.lat}&longitude=${w.lon}&current=temperature_2m,weather_code&timezone=auto`)).json();
    const c=r.current;
    document.getElementById('w-emoji').textContent=WCODE[c.weather_code]||'🌡️';
    document.getElementById('w-temp').textContent=Math.round(c.temperature_2m)+'°';
  }catch{document.getElementById('w-emoji').textContent='🌡️';document.getElementById('w-temp').textContent='--°';}
}
