<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>super-nono.cc</title>
<meta name="theme-color" content="#0e0f11">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link href="/vendor/mdi/css/materialdesignicons.min.css" rel="stylesheet">
<style>
  /* ── Cockpit : rail latéral + bandeau horloge/météo + tuiles teintées (palette RecipeLog) ── */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0e0f11;--panel:#16181c;--panel-2:#1b1e23;--panel-3:#212530;
    --line:#2a2e35;--line-soft:#20242a;
    --text:#ededed;--muted:#8b9099;--muted-2:#5f646c;
    --accent:#e8c547;--accent-soft:rgba(232,197,71,.14);--accent-line:rgba(232,197,71,.4);
    --danger:#e85c47;
    --serif:'DM Serif Display',Georgia,serif;--mono:'DM Mono',ui-monospace,monospace;
    --r-sm:8px;--r:12px;--r-lg:18px;
    color-scheme:dark;
  }
  html,body{background:var(--bg);color:var(--text);font-family:var(--mono);min-height:100%}
  body{-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;color:inherit}

  .app{display:flex;align-items:flex-start;min-height:100vh;min-height:100dvh}

  /* ── RAIL (desktop) ── */
  .rail{position:sticky;top:0;height:100vh;height:100dvh;width:84px;flex:none;background:var(--panel-2);border-right:1px solid var(--line-soft);display:flex;flex-direction:column;align-items:center;gap:5px;padding:16px 0;overflow-y:auto;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rail-logo{font-family:var(--serif);color:var(--accent);font-size:24px;margin-bottom:12px}
  .rail-item{width:64px;padding:9px 2px;border:none;background:none;border-radius:var(--r-sm);display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);position:relative;transition:color .15s,background .15s}
  .rail-item .ri-ico{font-size:20px;line-height:1}
  .rail-item .ri-ico .letter{font-family:var(--serif)}
  .rail-item .ri-lbl{font-size:8.5px;letter-spacing:.4px;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase}
  .rail-item:hover{color:var(--text)}
  .rail-item.on{color:var(--accent);background:var(--accent-soft)}
  .rail-item.on::before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:3px;border-radius:0 2px 2px 0;background:var(--accent)}
  .rail-item.add{color:var(--muted-2)}

  /* ── MAIN ── */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .hero{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;padding:26px 30px 20px;border-bottom:1px solid var(--line-soft)}
  .hero-l .brand{font-family:var(--serif);font-size:16px;color:var(--accent);letter-spacing:.3px}
  .hero-l .brand span{color:var(--text);font-style:italic}
  .hero-l .sub{font-size:9px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.14em;margin-top:2px}
  .hero-l .clock{font-family:var(--serif);font-size:clamp(38px,7vw,56px);line-height:1;letter-spacing:1px;font-variant-numeric:tabular-nums;margin-top:10px}
  .hero-l .date{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1.4px;margin-top:9px}
  .hero-r{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
  .wx{display:flex;align-items:center;gap:12px;text-align:right}
  .wx .wx-emoji{font-size:34px;line-height:1}
  .wx .wx-temp{font-family:var(--serif);font-size:30px;line-height:1}
  .wx .wx-cond{font-size:11px;color:var(--muted)}
  .wx .wx-loc{font-size:9.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
  .admin{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .lnk{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--panel);border:1px solid var(--line-soft);border-radius:999px;padding:6px 12px;transition:color .2s,border-color .2s}
  .lnk:hover,.lnk.active{color:var(--accent);border-color:var(--accent-line)}

  /* ── CONTENU ── */
  .content{padding:24px 30px 60px;display:flex;flex-direction:column}
  .cat-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  .cat-title{font-family:var(--serif);font-size:clamp(24px,4vw,32px);color:var(--accent)}
  .manage-btns{display:flex;gap:5px;flex-wrap:wrap}
  .mbtn{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:6px;font-size:11px;padding:5px 9px;font-family:var(--mono);transition:border-color .2s,color .2s;line-height:1.3}
  .mbtn:hover{border-color:var(--accent);color:var(--accent)}
  .mbtn.del:hover{border-color:var(--danger);color:var(--danger)}
  .add-cat-btn{align-self:flex-start;margin-top:20px}

  /* ── FAVORIS ── */
  .fav-row{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0 6px}
  .fav{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line-soft);border-radius:999px;padding:6px 15px 6px 7px;font-size:12.5px;transition:border-color .2s,transform .15s}
  .fav:hover{border-color:var(--accent-line);transform:translateY(-1px)}
  .fav .fav-ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:14px;flex:none}
  .fav .fav-ico .i-img{width:16px;height:16px;object-fit:contain}
  .fav .fav-ico .mdi{font-size:15px}

  /* ── BANDES / SECTIONS ── */
  .band{margin-top:24px}
  .band-lbl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .band-name{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted-2)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
  .tile{position:relative;border-radius:var(--r);padding:16px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line-soft);color:var(--text);transition:transform .15s,border-color .2s}
  .tile:hover{transform:translateY(-3px)}
  .tile-ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:21px;flex:none}
  .tile-ico .i-img{width:24px;height:24px;object-fit:contain}
  .tile-ico .mdi{font-size:22px;line-height:1}
  .tile-t{font-family:var(--serif);font-size:18px;margin-top:14px;line-height:1.1}
  .tile-d{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ── RACCOURCIS ── */
  .shortcuts{display:flex;flex-wrap:wrap;gap:9px;margin-top:4px}
  .chip{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;padding:9px 14px;color:var(--text);transition:border-color .2s,transform .15s;position:relative}
  .chip:hover{transform:translateY(-1px)}
  .chip .chip-ico{display:flex;align-items:center;justify-content:center;font-size:16px}
  .chip .chip-ico .i-img{width:18px;height:18px;object-fit:contain}
  .chip-title{font-size:13px}

  .item-actions{position:absolute;top:8px;right:8px;display:flex;gap:4px;z-index:2}
  .item-actions .mbtn{padding:3px 6px;font-size:10px;background:var(--bg)}
  .empty{font-size:12px;color:var(--muted-2);font-style:italic;padding:6px 0}

  /* ── TABBAR (mobile) ── */
  .tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:100;background:var(--panel-2);border-top:1px solid var(--line-soft);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-around;gap:2px}
  .tab-item{flex:1;min-width:0;border:none;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;border-radius:8px}
  .tab-item .ti-ico{font-size:19px;line-height:1}
  .tab-item .ti-ico .letter{font-family:var(--serif)}
  .tab-item .ti-lbl{font-size:8px;text-transform:uppercase;letter-spacing:.3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tab-item.on{color:var(--accent)}

  @media (max-width:719px){
    .rail{display:none}
    .app{display:block}
    .hero{padding:20px 18px 16px}
    .hero-l .clock{margin-top:8px}
    .content{padding:18px 16px calc(90px + env(safe-area-inset-bottom,0px))}
    .tiles{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
    .tabbar{display:flex}
  }

  /* ── MODALS (bottom sheet) ── */
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:500;align-items:flex-end;justify-content:center}
  .overlay.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:460px;padding:1.2rem 1.4rem calc(2.2rem + env(safe-area-inset-bottom,0px));max-height:92vh;overflow-y:auto}
  @media (min-width:720px){.overlay{align-items:center}.modal{border-radius:20px}}
  .handle{width:36px;height:4px;background:var(--line);border-radius:2px;margin:0 auto .9rem}
  .modal-title{font-family:var(--serif);font-size:1.2rem;color:var(--accent);margin-bottom:1.1rem}
  .field{display:flex;flex-direction:column;gap:.25rem;margin-bottom:.8rem}
  .field label{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .field input[type=text],.field input[type=url],.field input[type=password]{background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:.85rem;padding:.6rem .75rem;outline:none;width:100%}
  .field input:focus{border-color:var(--accent)}
  .check-row{display:flex;align-items:center;gap:.55rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.6rem .75rem;cursor:pointer;font-size:.8rem}
  .check-row input{width:16px;height:16px;accent-color:var(--accent)}
  .row{display:flex;gap:.8rem;margin-top:1rem}
  .btn-cancel{flex:1;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;font-family:var(--mono);font-size:.82rem;padding:.75rem}
  .btn-ok{flex:2;background:var(--accent);color:#0e0f11;border:none;border-radius:8px;font-family:var(--mono);font-size:.82rem;font-weight:500;padding:.75rem}
  .btn-ok:hover{opacity:.88}

  .tabs{display:flex;gap:.4rem;margin-bottom:.6rem}
  .tab{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--muted);border-radius:8px;font-size:.7rem;padding:.5rem;font-family:var(--mono);transition:.15s}
  .tab.active{border-color:var(--accent);color:var(--accent)}
  .tabpane{display:none}.tabpane.active{display:block}
  .icon-preview{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem;font-size:1.6rem;min-height:2rem}
  .icon-preview .i-img{width:1.8rem;height:1.8rem;object-fit:contain}
  .icon-preview .mdi{font-size:1.6rem}
  .emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:170px;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.4rem}
  .emoji-cats{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;margin-bottom:.3rem}
  .emoji-cats::-webkit-scrollbar{display:none}
  .ecat{background:none;border:none;padding:.3rem .45rem;font-size:.95rem;opacity:.5}
  .ecat.active{opacity:1}
  .eitem{font-size:1.3rem;text-align:center;padding:.2rem;border-radius:6px;cursor:pointer}
  .eitem:hover{background:var(--line)}

  .cp-grad{width:100%;height:130px;border-radius:8px;position:relative;cursor:crosshair;touch-action:none}
  .cp-grad::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent,#000);border-radius:8px;pointer-events:none}
  .cp-cursor{position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #000;transform:translate(-50%,-50%);pointer-events:none;z-index:2}
  .cp-hue{width:100%;height:14px;border-radius:7px;margin-top:.5rem;-webkit-appearance:none;appearance:none;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
  .cp-hue::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #555}
  .cp-bottom{display:flex;align-items:center;gap:.6rem;margin-top:.6rem}
  .cp-swatch{width:30px;height:30px;border-radius:6px;border:1px solid var(--line)}
  .cp-hex-wrap{display:flex;align-items:center;gap:.3rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.35rem .6rem;flex:1}
  .cp-hex{background:none;border:none;color:var(--text);font-family:var(--mono);font-size:.8rem;width:100%;outline:none}
  .cp-presets{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
  .cp-preset{width:22px;height:22px;border-radius:4px;cursor:pointer;border:2px solid transparent}
  .cp-preset.selected{border-color:var(--text)}

  .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(4rem);background:var(--accent);color:#0e0f11;font-size:.78rem;padding:.6rem 1.2rem;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;z-index:600}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){.tile,.chip,.fav,.lnk{transition:none}}
</style>
</head>
<body>

<div class="app">
  <aside class="rail" id="rail"></aside>

  <main class="main">
    <header class="hero">
      <div class="hero-l">
        <div class="brand" id="brand">super<span>-nono</span></div>
        <div class="sub" id="sub">Mon hub central</div>
        <div class="clock" id="w-time">--:--</div>
        <div class="date" id="w-date">—</div>
      </div>
      <div class="hero-r">
        <div class="admin">
          <button class="lnk" id="manage-lnk" onclick="toggleManage()" style="display:none">Gérer</button>
          <button class="lnk" id="update-lnk" onclick="doUpdate()" style="display:none">↻ MàJ</button>
          <button class="lnk" id="pass-lnk" onclick="openChangePass()" style="display:none">Mot de passe</button>
          <button class="lnk" id="logout-lnk" onclick="logout()" style="display:none">Déconnexion</button>
          <button class="lnk" id="login-lnk" onclick="openLogin()">Admin</button>
        </div>
        <div class="wx">
          <div class="wx-emoji" id="w-emoji">⏳</div>
          <div>
            <div class="wx-temp" id="w-temp">--°</div>
            <div class="wx-cond" id="w-cond">—</div>
            <div class="wx-loc" id="w-loc">—</div>
          </div>
        </div>
      </div>
    </header>

    <div class="content" id="content"></div>
  </main>

  <nav class="tabbar" id="tabbar"></nav>
</div>

<!-- ══ MODAL ITEM (app / raccourci) ══ -->
<div class="overlay" id="m-item" onclick="closeOverlay(event,'m-item')">
  <div class="modal">
    <div class="handle"></div>
    <div class="modal-title" id="m-item-title">Ajouter</div>

    <div class="field">
      <label>Icône</label>
      <div class="icon-preview" id="icon-preview"></div>
      <div class="tabs">
        <button class="tab active" data-tab="emoji" onclick="switchIconTab('emoji')">Emoji</button>
        <button class="tab" data-tab="image" onclick="switchIconTab('image')">Logo</button>
        <button class="tab" data-tab="mdi" onclick="switchIconTab('mdi')">MDI</button>
      </div>
      <div class="tabpane active" data-pane="emoji">
        <div class="emoji-cats" id="emoji-cats"></div>
        <div class="emoji-grid" id="emoji-grid"></div>
      </div>
      <div class="tabpane" data-pane="image">
        <input type="file" id="f-file" accept="image/*" onchange="uploadIcon(this)">
        <div style="font-size:.6rem;color:var(--muted);margin-top:.3rem">PNG/SVG carré conseillé (max 2 Mo).</div>
      </div>
      <div class="tabpane" data-pane="mdi">
        <input type="text" id="f-mdi" placeholder="ex : server, home-automation…" oninput="previewMdi(this.value)">
        <div style="font-size:.6rem;color:var(--muted);margin-top:.3rem">Nom d'icône <a href="https://pictogrammers.com/library/mdi/" target="_blank" rel="noopener" style="color:var(--accent)">Material Design Icons</a> (sans le préfixe mdi-).</div>
      </div>
    </div>

    <div class="field">
      <label>Nom</label>
      <input type="text" id="f-title" placeholder="Mon app">
    </div>
    <div class="field" id="f-desc-field">
      <label>Description</label>
      <input type="text" id="f-desc" placeholder="Courte description…">
    </div>
    <div class="field">
      <label>Lien (URL)</label>
      <input type="url" id="f-url" placeholder="https://…">
    </div>

    <div class="field">
      <label>Couleur d'accent</label>
      <div class="cp-grad" id="cp-grad"><div class="cp-cursor" id="cp-cursor"></div></div>
      <input type="range" class="cp-hue" id="cp-hue" min="0" max="360" value="45">
      <div class="cp-bottom">
        <div class="cp-swatch" id="cp-swatch"></div>
        <div class="cp-hex-wrap"><span style="color:var(--muted)">#</span><input class="cp-hex" id="cp-hex" maxlength="6" value="e8c547"></div>
      </div>
      <div class="cp-presets" id="cp-presets"></div>
    </div>

    <div class="field">
      <label>Favori</label>
      <label class="check-row"><input type="checkbox" id="f-fav"> Afficher dans la barre des favoris</label>
    </div>

    <div class="row">
      <button class="btn-cancel" onclick="closeOverlay(null,'m-item')">Annuler</button>
      <button class="btn-ok" onclick="saveItem()">Enregistrer</button>
    </div>
  </div>
</div>

<!-- ══ MODAL LOGIN ══ -->
<div class="overlay" id="m-login" onclick="closeOverlay(event,'m-login')">
  <div class="modal">
    <div class="handle"></div>
    <div class="modal-title">Connexion admin</div>
    <div class="field">
      <label>Mot de passe</label>
      <input type="password" id="f-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="row">
      <button class="btn-cancel" onclick="closeOverlay(null,'m-login')">Annuler</button>
      <button class="btn-ok" onclick="doLogin()">Se connecter</button>
    </div>
  </div>
</div>

<!-- ══ MODAL CHANGER MOT DE PASSE ══ -->
<div class="overlay" id="m-pass" onclick="closeOverlay(event,'m-pass')">
  <div class="modal">
    <div class="handle"></div>
    <div class="modal-title">Changer le mot de passe</div>
    <div class="field"><label>Mot de passe actuel</label><input type="password" id="p-cur" placeholder="••••••••"></div>
    <div class="field"><label>Nouveau mot de passe</label><input type="password" id="p-new" placeholder="min. 4 caractères"></div>
    <div class="field"><label>Confirmer</label><input type="password" id="p-conf" placeholder="••••••••"></div>
    <div class="row">
      <button class="btn-cancel" onclick="closeOverlay(null,'m-pass')">Annuler</button>
      <button class="btn-ok" onclick="doChangePass()">Enregistrer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── ÉTAT ─────────────────────────────────────────────────────────────────────
let config = { settings:{}, categories:[] };
let manageMode = false;
let token = localStorage.getItem('hub_token') || '';
let currentCat = null;
let editRef = null;
let curIcon = { kind:'emoji', value:'🔗' };

const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,5);
function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.style.background=err?'var(--danger)':'var(--accent)';t.style.color=err?'#fff':'#0e0f11';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}

// ─── CHARGEMENT ───────────────────────────────────────────────────────────────
async function init(){
  const cfg = await (await fetch('/api/config')).json();
  config = cfg;
  if(!currentCat || !findCat(currentCat)) currentCat = (config.categories[0]||{}).id || null;
  applySettings();
  render();
  startClock();
  loadWeather();
  if(token) setLogged(true);
}
function applySettings(){
  const s = config.settings||{};
  if(s.title!=null) document.getElementById('brand').innerHTML = esc(s.title)+'<span>'+esc(s.titleAccent||'')+'</span>';
  if(s.subtitle!=null) document.getElementById('sub').textContent = s.subtitle;
}

// ─── ICÔNES ───────────────────────────────────────────────────────────────────
function iconHTML(icon){
  if(!icon) return '';
  if(icon.kind==='image') return `<img class="i-img" src="${esc(icon.value)}" alt="">`;
  if(icon.kind==='mdi') return `<i class="mdi mdi-${esc(icon.value)}"></i>`;
  return `<span class="i-emoji">${esc(icon.value)}</span>`;
}
function catIcon(cat){
  if(cat.icon) return `<span class="emoji">${esc(cat.icon)}</span>`;
  return `<span class="letter">${esc((cat.name||'?').trim().charAt(0).toUpperCase()||'?')}</span>`;
}
function actionsHTML(catId,secId,item){
  return `<div class="item-actions">
    <button class="mbtn" onclick="moveItem('${catId}','${secId}','${item.id}',-1);event.preventDefault();event.stopPropagation()">↑</button>
    <button class="mbtn" onclick="moveItem('${catId}','${secId}','${item.id}',1);event.preventDefault();event.stopPropagation()">↓</button>
    <button class="mbtn" onclick="openItem('${catId}','${secId}','${item.id}');event.preventDefault();event.stopPropagation()">✎</button>
    <button class="mbtn del" onclick="deleteItem('${catId}','${secId}','${item.id}');event.preventDefault();event.stopPropagation()">✕</button>
  </div>`;
}
function hexA(hex,a){hex=(hex||'#e8c547').replace('#','');if(hex.length===3)hex=hex.split('').map(x=>x+x).join('');const r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);return `rgba(${r||0},${g||0},${b||0},${a})`;}

// ─── RENDU ────────────────────────────────────────────────────────────────────
function render(){
  document.getElementById('manage-lnk').classList.toggle('active',manageMode);
  document.getElementById('manage-lnk').textContent = manageMode?'Terminer':'Gérer';
  renderRail();
  renderTabbar();
  renderContent();
}

function renderRail(){
  let html = `<div class="rail-logo">◆</div>`;
  config.categories.forEach(cat=>{
    html += `<button class="rail-item ${cat.id===currentCat?'on':''}" onclick="selectCat('${cat.id}')" title="${esc(cat.name)}">
      <span class="ri-ico">${catIcon(cat)}</span>
      <span class="ri-lbl">${esc(cat.name)}</span>
    </button>`;
  });
  if(manageMode) html += `<button class="rail-item add" onclick="addCat()"><span class="ri-ico">＋</span><span class="ri-lbl">Cat.</span></button>`;
  document.getElementById('rail').innerHTML = html;
}

function renderTabbar(){
  let html = '';
  config.categories.forEach(cat=>{
    html += `<button class="tab-item ${cat.id===currentCat?'on':''}" onclick="selectCat('${cat.id}')">
      <span class="ti-ico">${catIcon(cat)}</span>
      <span class="ti-lbl">${esc(cat.name)}</span>

  document.getElementById('tabbar').innerHTML = html;
}

function renderContent(){
  const wrap = document.getElementById('content');
  const cat = findCat(currentCat) || config.categories[0];
  if(!cat){
    wrap.innerHTML = manageMode
      ? `<button class="mbtn" onclick="addCat()">+ Créer une catégorie</button>`
      : `<div class="empty">Aucune catégorie pour le moment.</div>`;
    return;
  }
  let html = `<div class="cat-bar"><div class="cat-title">${esc(cat.name)}</div>`;
  if(manageMode){
    html += `<div class="manage-btns">
      <button class="mbtn" onclick="moveCat('${cat.id}',-1)">↑</button>
      <button class="mbtn" onclick="moveCat('${cat.id}',1)">↓</button>
      <button class="mbtn" onclick="renameCat('${cat.id}')">✎ Nom</button>
      <button class="mbtn" onclick="setCatIcon('${cat.id}')">☺ Icône</button>
      <button class="mbtn" onclick="addSec('${cat.id}')">+ Section</button>
      <button class="mbtn del" onclick="deleteCat('${cat.id}')">✕</button>
    </div>`;
  }
  html += `</div>`;

  // Favoris (hors mode gestion)
  if(!manageMode){
    const favs = collectFavs();
    if(favs.length){
      html += `<div class="fav-row">`;
      favs.forEach(it=>{
        html += `<a class="fav" href="${esc(it.url)}">
          <span class="fav-ico" style="background:${hexA(it.color,.22)};color:${esc(it.color||'var(--accent)')}">${iconHTML(it.icon)}</span>
          <span>${esc(it.title)}</span>
        </a>`;
      });
      html += `</div>`;
    }
  }

  (cat.sections||[]).forEach(sec=>{
    html += `<div class="band"><div class="band-lbl"><div class="band-name">${esc(sec.name)}</div>`;
    if(manageMode){
      html += `<div class="manage-btns">
        <button class="mbtn" onclick="openItem('${cat.id}','${sec.id}',null,'app')">+App</button>
        <button class="mbtn" onclick="openItem('${cat.id}','${sec.id}',null,'shortcut')">+Raccourci</button>
        <button class="mbtn" onclick="moveSec('${cat.id}','${sec.id}',-1)">↑</button>
        <button class="mbtn" onclick="moveSec('${cat.id}','${sec.id}',1)">↓</button>
        <button class="mbtn" onclick="renameSec('${cat.id}','${sec.id}')">✎</button>
        <button class="mbtn del" onclick="deleteSec('${cat.id}','${sec.id}')">✕</button>
      </div>`;
    }
    html += `</div>`;

    const apps = (sec.items||[]).filter(i=>i.type!=='shortcut');
    const shorts = (sec.items||[]).filter(i=>i.type==='shortcut');

    if(apps.length){
      html += `<div class="tiles">`;
      apps.forEach(it=>{
        const bg = `linear-gradient(150deg, ${hexA(it.color,.20)}, var(--panel) 82%)`;
        html += `<a class="tile" href="${esc(it.url)}" style="background:${bg};border-color:${hexA(it.color,.4)}"
          ${manageMode?'onclick="return false"':''}>
          ${manageMode?actionsHTML(cat.id,sec.id,it):''}
          <div class="tile-ico" style="background:${hexA(it.color,.24)};border:1px solid ${hexA(it.color,.5)};color:${esc(it.color||'var(--text)')}">${iconHTML(it.icon)}</div>
          <div>
            <div class="tile-t">${esc(it.title)}</div>
            <div class="tile-d">${esc(it.desc||'')}</div>
          </div>
        </a>`;
      });
      html += `</div>`;
    }
    if(shorts.length){
      html += `<div class="shortcuts">`;
      shorts.forEach(it=>{
        html += `<a class="chip" href="${esc(it.url)}" style="border-color:${hexA(it.color,.35)}"
          ${manageMode?'onclick="return false"':''}>
          ${manageMode?actionsHTML(cat.id,sec.id,it):''}
          <span class="chip-ico" style="color:${esc(it.color||'var(--text)')}">${iconHTML(it.icon)}</span>
          <span class="chip-title">${esc(it.title)}</span>
        </a>`;
      });
      html += `</div>`;
    }
    if(!apps.length && !shorts.length) html += `<div class="empty">Vide</div>`;
    html += `</div>`;
  });

  if(manageMode) html += `<button class="mbtn add-cat-btn" onclick="addSec('${cat.id}')">+ Section</button>`;
  wrap.innerHTML = html;
}

function collectFavs(){
  const out = [];
  config.categories.forEach(c=>(c.sections||[]).forEach(s=>(s.items||[]).forEach(it=>{ if(it.fav) out.push(it); })));
  return out;
}

async function addCat(){
  const n=prompt('Nom de la catégorie ?');if(!n)return;
  const ic=prompt('Icône (un emoji, optionnel) :','')||'';
  const c={id:uid(),name:n.trim(),icon:ic.trim(),sections:[]};

async function moveItem(cId,sId,itId,d){const a=findSec(cId,sId).items;const i=a.findIndex(x=>x.id===itId);const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];render();await save();}

function openItem(cId,sId,itId,type){
  editRef={catId:cId,secId:sId,itemId:itId,type:type};
  const it = itId ? findSec(cId,sId).items.find(x=>x.id===itId) : null;
  if(it) type=it.type;
  editRef.type=type;
  document.getElementById('m-item-title').textContent = (itId?'Modifier ':'Ajouter ')+(type==='shortcut'?'un raccourci':'une app');
  document.getElementById('f-desc-field').style.display = type==='shortcut'?'none':'flex';
  curIcon = it && it.icon ? {...it.icon} : {kind:'emoji',value:'🔗'};
  document.getElementById('f-title').value = it?it.title:'';
  document.getElementById('f-desc').value = it?(it.desc||''):'';
  document.getElementById('f-url').value = it?it.url:'';
  document.getElementById('f-mdi').value = curIcon.kind==='mdi'?curIcon.value:'';
  document.getElementById('f-fav').checked = it?!!it.fav:false;
  switchIconTab(curIcon.kind);
  refreshIconPreview();
  setColorHex((it&&it.color?it.color:'#e8c547').replace('#',''));
  openOverlay('m-item');
}
async function saveItem(){
  const title=document.getElementById('f-title').value.trim();
  let url=document.getElementById('f-url').value.trim();
  if(!title||!url){toast('Nom et lien requis',true);return;}
  if(!/^https?:\/\//i.test(url)) url='https://'+url;
  const data={id:editRef.itemId||uid(),type:editRef.type,icon:curIcon,title,desc:document.getElementById('f-desc').value.trim(),url,color:'#'+document.getElementById('cp-hex').value,fav:document.getElementById('f-fav').checked};
  const sec=findSec(editRef.catId,editRef.secId);
  if(editRef.itemId){const i=sec.items.findIndex(x=>x.id===editRef.itemId);sec.items[i]=data;}
  else sec.items.push(data);
  render();
  if(await save()){closeOverlay(null,'m-item');toast(editRef.itemId?'Modifié ✓':'Ajouté ✓');}
}

const PRESETS=['#e8c547','#4fc3a1','#a78bfa','#e87c47','#5bc4e8','#e85c47','#f472b6','#34d399','#60a5fa','#fb923c','#a3e635','#ffffff'];
let cpHue=45,cpSat=70,cpVal=80;
function initCP(){
  const pr=document.getElementById('cp-presets');
  pr.innerHTML=PRESETS.map(p=>`<div class="cp-preset" data-c="${p}" style="background:${p}" onclick="setColorHex('${p.replace('#','')}')"></div>`).join('');
  const grad=document.getElementById('cp-grad');let drag=false;
  function pick(e){const r=grad.getBoundingClientRect();const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;cpSat=Math.max(0,Math.min(100,x/r.width*100));cpVal=Math.max(0,Math.min(100,100-y/r.height*100));fromHSV();}
  grad.addEventListener('mousedown',e=>{drag=true;pick(e);});
  grad.addEventListener('touchstart',e=>{drag=true;pick(e);e.preventDefault();},{passive:false});
  document.addEventListener('mousemove',e=>{if(drag)pick(e);});
  document.addEventListener('touchmove',e=>{if(drag)pick(e);},{passive:false});
  document.addEventListener('mouseup',()=>drag=false);document.addEventListener('touchend',()=>drag=false);
  document.getElementById('cp-hue').addEventListener('input',e=>{cpHue=+e.target.value;fromHSV();});
  document.getElementById('cp-hex').addEventListener('change',e=>setColorHex(e.target.value.replace('#','')));
  fromHSV();
}
function fromHSV(){
  document.getElementById('cp-grad').style.background=`linear-gradient(to right,#fff,hsl(${cpHue},100%,50%))`;
  document.getElementById('cp-cursor').style.left=cpSat+'%';document.getElementById('cp-cursor').style.top=(100-cpVal)+'%';
  const [r,g,b]=hsv2rgb(cpHue,cpSat,cpVal);const hex=rgbHex(r,g,b);
  document.getElementById('cp-hex').value=hex;document.getElementById('cp-swatch').style.background='#'+hex;
  document.querySelectorAll('.cp-preset').forEach(d=>d.classList.toggle('selected',d.dataset.c.toLowerCase().replace('#','')===hex.toLowerCase()));
}
function setColorHex(hex){if(hex.length!==6)return;const r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);[cpHue,cpSat,cpVal]=rgb2hsv(r,g,b);fromHSV();}
function hsv2rgb(h,s,v){s/=100;v/=100;const i=Math.floor(h/60)%6,f=h/60-Math.floor(h/60);const p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);const m=[[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i];return m.map(x=>Math.round(x*255));}
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d+6)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}return [Math.round(h),mx?Math.round(d/mx*100):0,Math.round(mx*100)];}
function rgbHex(r,g,b){return [r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');}

// ─── MODALS ───────────────────────────────────────────────────────────────────
function openOverlay(id){document.getElementById(id).classList.add('open');}
function closeOverlay(e,id){if(e&&e.target!==document.getElementById(id))return;document.getElementById(id).classList.remove('open');}

// ─── WIDGETS ──────────────────────────────────────────────────────────────────
function startClock(){
  const upd=()=>{
    const d=new Date();
    document.getElementById('w-time').textContent=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('w-date').textContent=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  };
  upd();setInterval(upd,10000);
}
const WCODE={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',73:'🌨️',75:'❄️',80:'🌦️',81:'🌧️',82:'⛈️',95:'⛈️',96:'⛈️',99:'⛈️'};
const WLABEL={0:'Ciel clair',1:'Peu nuageux',2:'Nuages épars',3:'Couvert',45:'Brouillard',48:'Brouillard givrant',51:'Bruine',53:'Bruine',55:'Bruine dense',61:'Pluie faible',63:'Pluie',65:'Forte pluie',71:'Neige faible',73:'Neige',75:'Fortes chutes',80:'Averses',81:'Averses',82:'Fortes averses',95:'Orage',96:'Orage & grêle',99:'Orage & grêle'};
async function loadWeather(){
  const w=(config.settings||{}).weather;if(!w){document.getElementById('w-emoji').textContent='—';document.getElementById('w-cond').textContent='';return;}
  document.getElementById('w-loc').textContent=w.label||'';
  try{
    const r=await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${w.lat}&longitude=${w.lon}&current=temperature_2m,weather_code&timezone=auto`)).json();
    const c=r.current;
    document.getElementById('w-emoji').textContent=WCODE[c.weather_code]||'🌡️';
    document.getElementById('w-temp').textContent=Math.round(c.temperature_2m)+'°';
    document.getElementById('w-cond').textContent=WLABEL[c.weather_code]||'';
  }catch{document.getElementById('w-emoji').textContent='🌡️';document.getElementById('w-temp').textContent='--°';document.getElementById('w-cond').textContent='indisponible';}
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
initEmoji();initCP();init();
</script>
