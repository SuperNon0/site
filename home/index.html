<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>super-nono.cc</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0e0f11;--card:#1c1f25;--border:#2a2d35;
    --accent:#e8c547;--text:#f0ede6;--muted:#6b6f7a;--danger:#e85c47;
  }
  body{font-family:'DM Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}

  .logo{font-family:'DM Serif Display',serif;font-size:2.2rem;color:var(--accent);letter-spacing:-.5px;margin-bottom:.3rem;text-align:center}
  .logo span{color:var(--text);font-style:italic}
  .sub{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:3rem;text-align:center}

  .section-header{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:340px;margin-bottom:.6rem}
  .section-label{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
  .btn-add{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;font-family:'DM Mono',monospace;font-size:.65rem;padding:.25rem .6rem;cursor:pointer;transition:border-color .2s,color .2s}
  .btn-add:hover{border-color:var(--accent);color:var(--accent)}

  .cards{display:flex;flex-direction:column;gap:.75rem;width:100%;max-width:340px;margin-bottom:2rem}
  .card{display:flex;align-items:center;gap:1.2rem;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1rem 1.2rem;text-decoration:none;color:var(--text);transition:border-color .2s,transform .15s,background .2s;position:relative}
  .card:hover{transform:translateY(-2px)}
  .card-icon{font-size:1.8rem;flex-shrink:0;width:2.4rem;text-align:center}
  .card-body{flex:1;min-width:0}
  .card-title{font-family:'DM Serif Display',serif;font-size:1.1rem;margin-bottom:.15rem}
  .card-desc{font-size:.63rem;color:var(--muted);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-arrow{font-size:.9rem;flex-shrink:0;transition:color .2s}

  .card-actions{position:absolute;top:.45rem;right:.6rem;display:none;gap:.3rem}
  .cards.edit-mode .card-actions{display:flex}
  .cards.edit-mode .card{padding-top:1.8rem}
  .cards.edit-mode .card-arrow{display:none}
  .btn-card-action{background:var(--bg);border:1px solid var(--border);color:var(--muted);border-radius:5px;font-size:.58rem;padding:.15rem .35rem;cursor:pointer;font-family:'DM Mono',monospace;transition:border-color .2s,color .2s;line-height:1.4}
  .btn-card-action:hover{border-color:var(--accent);color:var(--accent)}
  .btn-card-action.del:hover{border-color:var(--danger);color:var(--danger)}

  .edit-toggle{font-size:.55rem;color:var(--muted);cursor:pointer;text-transform:uppercase;letter-spacing:.08em;background:none;border:none;font-family:'DM Mono',monospace;transition:color .2s}
  .edit-toggle:hover,.edit-toggle.active{color:var(--accent)}
  .footer{font-size:.58rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

  /* ── MODAL ── */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:500;align-items:flex-end;justify-content:center}
  .modal-overlay.open{display:flex}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:420px;padding:1.2rem 1.4rem 2rem;max-height:92vh;overflow-y:auto}
  .modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto .9rem}
  .modal-title{font-family:'DM Serif Display',serif;font-size:1.2rem;color:var(--accent);margin-bottom:1.2rem}
  .field{display:flex;flex-direction:column;gap:.25rem;margin-bottom:.8rem}
  .field label{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .field input{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Mono',monospace;font-size:.82rem;padding:.5rem .75rem;outline:none}
  .field input:focus{border-color:var(--accent)}
  .modal-actions{display:flex;gap:.8rem;margin-top:1.2rem}
  .btn-cancel{flex:1;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;font-family:'DM Mono',monospace;font-size:.8rem;padding:.7rem;cursor:pointer}
  .btn-ok{flex:2;background:var(--accent);color:#0e0f11;border:none;border-radius:8px;font-family:'DM Mono',monospace;font-size:.8rem;font-weight:500;padding:.7rem;cursor:pointer}
  .btn-ok:hover{opacity:.85}

  /* ── EMOJI PICKER ── */
  .emoji-btn{display:flex;align-items:center;gap:.5rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.4rem .75rem;cursor:pointer;font-size:1.1rem;color:var(--muted);font-family:'DM Mono',monospace;font-size:.8rem}
  .emoji-btn:hover{border-color:var(--accent)}
  .emoji-btn .e-preview{font-size:1.3rem;line-height:1}
  .emoji-panel{background:var(--bg);border:1px solid var(--border);border-radius:10px;margin-top:.4rem;overflow:hidden;display:none}
  .emoji-panel.open{display:block}
  .emoji-search{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:.78rem;padding:.5rem .75rem;outline:none}
  .emoji-cats{display:flex;gap:0;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
  .emoji-cats::-webkit-scrollbar{display:none}
  .emoji-cat-btn{background:none;border:none;padding:.35rem .5rem;font-size:.95rem;cursor:pointer;flex-shrink:0;opacity:.5;transition:opacity .15s}
  .emoji-cat-btn.active,.emoji-cat-btn:hover{opacity:1}
  .emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:.4rem;max-height:180px;overflow-y:auto}
  .emoji-item{font-size:1.3rem;text-align:center;cursor:pointer;padding:.25rem;border-radius:6px;transition:background .15s;line-height:1.3}
  .emoji-item:hover{background:var(--border)}

  /* ── COLOR PICKER ── */
  .cp-wrap{margin-top:.3rem}
  .cp-gradient{width:100%;height:160px;border-radius:8px;position:relative;cursor:crosshair;user-select:none;touch-action:none}
  .cp-gradient::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent,#000);border-radius:8px;pointer-events:none}
  .cp-cursor{position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #000;transform:translate(-50%,-50%);pointer-events:none;z-index:2}
  .cp-hue-wrap{margin-top:.5rem;position:relative}
  .cp-hue{width:100%;height:14px;border-radius:7px;border:none;outline:none;cursor:pointer;
    background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);
    -webkit-appearance:none;appearance:none}
  .cp-hue::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #555;box-shadow:0 1px 3px rgba(0,0,0,.4);cursor:pointer}
  .cp-hue::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #555;cursor:pointer}
  .cp-bottom{display:flex;align-items:center;gap:.6rem;margin-top:.6rem}
  .cp-swatch{width:30px;height:30px;border-radius:6px;flex-shrink:0;border:1px solid var(--border)}
  .cp-hex-wrap{display:flex;align-items:center;gap:.3rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.3rem .6rem;flex:1}
  .cp-hash{color:var(--muted);font-size:.8rem}
  .cp-hex{background:none;border:none;color:var(--text);font-family:'DM Mono',monospace;font-size:.8rem;width:100%;outline:none}
  .cp-presets{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
  .cp-preset{width:22px;height:22px;border-radius:4px;cursor:pointer;border:2px solid transparent;transition:border-color .15s,transform .15s;flex-shrink:0}
  .cp-preset:hover{transform:scale(1.15)}
  .cp-preset.selected{border-color:var(--text)}

  /* TOAST */
  .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(4rem);background:var(--accent);color:#0e0f11;font-size:.75rem;font-weight:500;padding:.55rem 1.2rem;border-radius:20px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:600;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="logo">super<span>-nono</span></div>
<div class="sub">Mes outils perso</div>

<div class="section-header">
  <span class="section-label">Applications</span>
  <div style="display:flex;gap:.6rem;align-items:center">
    <button class="edit-toggle" id="edit-toggle" onclick="toggleEditMode()">Gérer</button>
    <button class="btn-add" onclick="openAdd()">+ Ajouter</button>
  </div>
</div>
<div class="cards" id="cards"></div>
<div class="footer">super-nono.cc</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">Ajouter un site</div>

    <!-- Emoji -->
    <div class="field">
      <label>Icône</label>
      <button type="button" class="emoji-btn" onclick="toggleEmojiPanel()">
        <span class="e-preview" id="f-icon-preview">🔗</span>
        <span style="color:var(--muted);font-size:.7rem">Choisir un emoji</span>
      </button>
      <div class="emoji-panel" id="emoji-panel">
        <input class="emoji-search" type="text" placeholder="Rechercher…" oninput="filterEmoji(this.value)">
        <div class="emoji-cats" id="emoji-cats"></div>
        <div class="emoji-grid" id="emoji-grid"></div>
      </div>
    </div>

    <!-- Nom / Desc / URL -->
    <div class="field">
      <label>Nom</label>
      <input type="text" id="f-title" placeholder="Mon app">
    </div>
    <div class="field">
      <label>Description</label>
      <input type="text" id="f-desc" placeholder="Courte description…">
    </div>
    <div class="field">
      <label>URL</label>
      <input type="url" id="f-url" placeholder="https://…">
    </div>

    <!-- Color picker -->
    <div class="field">
      <label>Couleur d'accent</label>
      <div class="cp-wrap">
        <div class="cp-gradient" id="cp-grad">
          <div class="cp-cursor" id="cp-cursor"></div>
        </div>
        <input type="range" class="cp-hue" id="cp-hue" min="0" max="360" value="45">
        <div class="cp-bottom">
          <div class="cp-swatch" id="cp-swatch"></div>
          <div class="cp-hex-wrap">
            <span class="cp-hash">#</span>
            <input class="cp-hex" type="text" id="cp-hex" maxlength="6" value="e8c547">
          </div>
        </div>
        <div class="cp-presets" id="cp-presets"></div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-ok" onclick="saveApp()">Enregistrer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

  { label:'🐶', name:'Animaux', emojis:'🐶🐱🐭🐹🐰🦊🐻🐼🐨🐯🦁🐮🐷🐸🐵🙈🙉🙊🐒🐔🐧🐦🐤🦆🦅🦉🦇🐺🐗🐴🦄🐝🪱🐛🦋🐌🐞🐜🦟🦗🕷🦂🐢🐍🦎🦖🦕🐙🦑🦐🦞🦀🐡🐠🐟🐬🐳🐋🦈🦭🐊🐅🐆🦓🦍🦧🦣🐘🦛🦏🐪🐫🦒🦘🦬🐃🐂🐄🐎🐖🐏🐑🦙🐐🦌🐕🐩🦮🐕‍🦺🐈🐈‍⬛🐓🦃🦤🦚🦜🦢🕊🐇🦝🦨🦡🦫🦦🦥🐁🐀🐿🦔🐾🐉🐲🌵🎄🌲🌳🌴🪵🌱🌿☘🍀🎍🎋🍃🍂🍁🍄🌾💐🌷🌹🥀🌺🌸🌼🌻🌞🌝🍇🍈🍉🍊🍋🍌🍍🥭🍎🍏🍐🍑🍒🍓🫐🥝🍅🫒🥥🥑🍆🥔🥕🌽🌶🫑🥒🥬🥦🧄🧅🍄🥜🌰🍞🥐🥖🫓🥨🥯🧀🥚🍳🧈🥞🧇🥓🥩🍗🍖🌭🍔🍟🍕🫓🌮🌯🫔🥙🧆🥚🍳🥘🍲🫕🥣🥗🍿🧂🥫🍱🍘🍙🍚🍛🍜🍝🍠🍢🍣🍤🍥🥮🍡🥟🥠🥡🦀🦞🦐🦑🦪🍦🍧🍨🍩🍪🎂🍰🧁🥧🍫🍬🍭🍮🍯🍼🥛☕🫖🍵🧃🥤🧋🍶🍺🍻🥂🍷🥃🍸🍹🧉🍾🧊🥄🍴🍽🥢🥡' },
  { label:'🚗', name:'Transport', emojis:'🚗🚕🚙🚌🚎🏎🚓🚑🚒🚐🛻🚚🚛🚜🏍🛵🛺🚲🛴🛹🛼🚏🛣🛤🛞⛽🚨🚥🚦🚧⚓🛟🚢✈🛩🛫🛬🛳⛴🚤🛥🚀🛸🚁🛶⛵🪂🛰🚞🚝🚄🚅🚈🚂🚃🚋🚆🚇🚊🚉🛤🚠🚡🚟🚃🏔⛰🌋🗻🏕🏖🏜🏝🏞🏟🏛🏗🧱🪨🪵🛖🏘🏚🏠🏡🏢🏣🏤🏥🏦🏨🏩🏪🏫🏬🏭🏯🏰💒🗼🗽⛪🕌🛕🕍⛩🕍🗾🎑🏞🌅🌄🌠🎇🎆🌇🌆🏙🌃🌌🌉🌁' },

const PRESETS = ['#e8c547','#4fc3a1','#a78bfa','#e87c47','#5bc4e8','#e85c47','#f472b6','#34d399','#60a5fa','#fb923c','#a3e635','#ffffff'];

let apps = [], editingId = null, editMode = false;
let cpHue = 45, cpSat = 70, cpVal = 80;
let emojiPanelOpen = false;
let selectedEmoji = '🔗';
let currentCat = 0;

// ─── TOAST ───────────────────────────────────────────────────────────────────
function toast(msg, err=false) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = err ? 'var(--danger)' : 'var(--accent)';
  t.style.color = err ? '#fff' : '#0e0f11';
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500);
}

// ─── APPS ─────────────────────────────────────────────────────────────────────
async function loadApps() {
  const res = await fetch('/api/apps'); apps = await res.json(); renderCards();
}
function renderCards() {
  const c = document.getElementById('cards');
  c.classList.toggle('edit-mode', editMode);
  c.innerHTML = apps.map(a => {
    const border = hexToRgba(a.color, .25);
    const borderHov = hexToRgba(a.color, .6);
    const bg = hexToRgba(a.color, .04);
    return `<a href="${a.url}" class="card" style="border-color:${border}"
      onmouseover="this.style.borderColor='${borderHov}';this.style.background='${bg}'"
      onmouseout="this.style.borderColor='${border}';this.style.background=''"
      ${editMode ? 'onclick="return false"' : ''}>
      <div class="card-actions">
        <button class="btn-card-action" onclick="moveApp('${a.id}','up');event.preventDefault()">↑</button>
        <button class="btn-card-action" onclick="moveApp('${a.id}','down');event.preventDefault()">↓</button>
        <button class="btn-card-action" onclick="openEdit('${a.id}');event.preventDefault()">Modifier</button>
        <button class="btn-card-action del" onclick="deleteApp('${a.id}');event.preventDefault()">Supprimer</button>
      </div>
      <div class="card-icon">${a.icon}</div>
      <div class="card-body">
        <div class="card-title" style="color:#${a.color.replace('#','')}">${a.title}</div>
        <div class="card-desc">${a.desc}</div>
      </div>
      <div class="card-arrow" style="color:var(--border)">›</div>
    </a>`;
  }).join('');
}
function hexToRgba(hex, alpha) {
  hex = hex.replace('#','');
  if (hex.length === 3) hex = hex.split('').map(x=>x+x).join('');
  const r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function toggleEditMode() {
  editMode = !editMode;
  const btn = document.getElementById('edit-toggle');
  btn.classList.toggle('active', editMode); btn.textContent = editMode ? 'Terminer' : 'Gérer';
  renderCards();
}

// ─── EMOJI PICKER ─────────────────────────────────────────────────────────────
function initEmoji() {
  const cats = document.getElementById('emoji-cats');
  EMOJI_CATS.forEach((c,i) => {
    const b = document.createElement('button');
    b.className = 'emoji-cat-btn' + (i===0?' active':'');
    b.title = c.name; b.textContent = c.label;
    b.onclick = () => { currentCat = i; showCat(i); document.querySelectorAll('.emoji-cat-btn').forEach((x,j)=>x.classList.toggle('active',j===i)); };
    cats.appendChild(b);
  });
  showCat(0);
}
function showCat(i) {
  const grid = document.getElementById('emoji-grid');
  const emojis = [...EMOJI_CATS[i].emojis];
  grid.innerHTML = emojis.map(e => `<div class="emoji-item" onclick="pickEmoji('${e}')">${e}</div>`).join('');
}
function filterEmoji(q) {
  if (!q.trim()) { showCat(currentCat); return; }
  const all = EMOJI_CATS.flatMap(c => [...c.emojis]);
  const grid = document.getElementById('emoji-grid');
  // simple filter: just show all (no names available — show all emojis for empty search result)
  grid.innerHTML = all.map(e => `<div class="emoji-item" onclick="pickEmoji('${e}')">${e}</div>`).join('');
}
function toggleEmojiPanel() {
  emojiPanelOpen = !emojiPanelOpen;
  document.getElementById('emoji-panel').classList.toggle('open', emojiPanelOpen);
}
function pickEmoji(e) {
  selectedEmoji = e;
  document.getElementById('f-icon-preview').textContent = e;
  document.getElementById('emoji-panel').classList.remove('open');
  emojiPanelOpen = false;
}

// ─── COLOR PICKER ────────────────────────────────────────────────────────────
function initColorPicker() {
  // Presets
  const presetWrap = document.getElementById('cp-presets');
  PRESETS.forEach(p => {
    const d = document.createElement('div');
    d.className = 'cp-preset'; d.style.background = p;
    d.dataset.color = p;
    d.onclick = () => { setColorHex(p.replace('#','')); updatePresetSelected(p); };
    presetWrap.appendChild(d);
  });

  // Gradient drag
  const grad = document.getElementById('cp-grad');
  let dragging = false;
  function pickFromGrad(e) {
    const rect = grad.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    cpSat = Math.max(0, Math.min(100, (cx - rect.left) / rect.width * 100));
    cpVal = Math.max(0, Math.min(100, 100 - (cy - rect.top) / rect.height * 100));
    updateFromHSV();
  }
  grad.addEventListener('mousedown', e => { dragging=true; pickFromGrad(e); });
  grad.addEventListener('touchstart', e => { dragging=true; pickFromGrad(e); e.preventDefault(); }, {passive:false});
  document.addEventListener('mousemove', e => { if(dragging) pickFromGrad(e); });
  document.addEventListener('touchmove', e => { if(dragging) pickFromGrad(e); }, {passive:false});
  document.addEventListener('mouseup', () => dragging=false);
  document.addEventListener('touchend', () => dragging=false);

  // Hue slider
  document.getElementById('cp-hue').addEventListener('input', e => {
    cpHue = +e.target.value; updateFromHSV();
  });

  // Hex input
  document.getElementById('cp-hex').addEventListener('change', e => {
    setColorHex(e.target.value.replace('#',''));
  });

  updateFromHSV();
}

function updateFromHSV() {
  const hue = cpHue;
  // Update gradient background
  const grad = document.getElementById('cp-grad');
  grad.style.background = `linear-gradient(to right, #fff, hsl(${hue},100%,50%))`;

  // Cursor position
  const cursor = document.getElementById('cp-cursor');
  cursor.style.left = cpSat + '%';
  cursor.style.top = (100 - cpVal) + '%';

  // Convert HSV → hex
  const [r,g,b] = hsvToRgb(hue, cpSat, cpVal);
  const hex = rgbToHex(r,g,b);
  document.getElementById('cp-hex').value = hex;
  document.getElementById('cp-swatch').style.background = '#' + hex;
  document.getElementById('cp-hue').value = hue;
  updatePresetSelected('#' + hex);
}

function setColorHex(hex) {
  if (hex.length !== 6) return;
  const r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
  const [h,s,v] = rgbToHsv(r,g,b);
  cpHue=h; cpSat=s; cpVal=v;
  updateFromHSV();
}

function updatePresetSelected(hex) {
  const norm = hex.toLowerCase().replace('#','');
  document.querySelectorAll('.cp-preset').forEach(d => {
    const c = d.dataset.color.toLowerCase().replace('#','');
    d.classList.toggle('selected', c === norm);
  });
}

function hsvToRgb(h,s,v) {
  s/=100; v/=100;
  const i=Math.floor(h/60)%6, f=h/60-Math.floor(h/60);
  const p=v*(1-s), q=v*(1-f*s), t=v*(1-(1-f)*s);
  const m=[[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i];
  return m.map(x=>Math.round(x*255));
}
function rgbToHsv(r,g,b) {
  r/=255;g/=255;b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  let h=0;
  if(d){
    if(max===r) h=((g-b)/d+6)%6;
    else if(max===g) h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h*=60;
  }
  return [Math.round(h), max?Math.round(d/max*100):0, Math.round(max*100)];
}
function rgbToHex(r,g,b){return[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('')}
function getPickedColor(){ return '#' + document.getElementById('cp-hex').value; }

// ─── MODAL OPEN / CLOSE ───────────────────────────────────────────────────────
function openAdd() {
  editingId = null;
  document.getElementById('modal-title').textContent = 'Ajouter un site';
  selectedEmoji = '🔗'; document.getElementById('f-icon-preview').textContent = '🔗';
  document.getElementById('f-title').value = '';
  document.getElementById('f-desc').value = '';
  document.getElementById('f-url').value = '';
  document.getElementById('emoji-panel').classList.remove('open'); emojiPanelOpen=false;
  cpHue=45; cpSat=70; cpVal=80; updateFromHSV();
  document.getElementById('modal').classList.add('open');
}
function openEdit(id) {
  const a = apps.find(x=>x.id===id); if(!a) return;
  editingId = id;
  document.getElementById('modal-title').textContent = 'Modifier';
  selectedEmoji = a.icon; document.getElementById('f-icon-preview').textContent = a.icon;
  document.getElementById('f-title').value = a.title;
  document.getElementById('f-desc').value = a.desc;
  document.getElementById('f-url').value = a.url;
  document.getElementById('emoji-panel').classList.remove('open'); emojiPanelOpen=false;
  setColorHex(a.color.replace('#',''));
  document.getElementById('modal').classList.add('open');
}
function closeModal(e) {
  if (e && e.target !== document.getElementById('modal')) return;
  document.getElementById('modal').classList.remove('open');
}

// ─── SAVE / DELETE / MOVE ─────────────────────────────────────────────────────
async function saveApp() {
  const data = {
    icon: selectedEmoji,
    title: document.getElementById('f-title').value.trim(),
    desc: document.getElementById('f-desc').value.trim(),
    url: ensureHttps(document.getElementById('f-url').value.trim()),
    color: getPickedColor(),
  };
  if (!data.title || !data.url) { toast('Nom et URL requis', true); return; }
  try {
    const url = editingId ? `/api/apps/${editingId}` : '/api/apps';
    const res = await fetch(url, { method: editingId?'PUT':'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
    const json = await res.json();
    if (!json.ok) { toast('Erreur : '+json.error, true); return; }
    apps = json.apps; renderCards();
    document.getElementById('modal').classList.remove('open');
    toast(editingId ? 'Modifié ✓' : 'Ajouté ✓');
  } catch(e) { toast('Erreur : '+e.message, true); }
}
async function deleteApp(id) {
  if (!confirm('Supprimer ce site ?')) return;
  const res = await fetch(`/api/apps/${id}`, {method:'DELETE'});
  const json = await res.json(); apps=json.apps; renderCards(); toast('Supprimé');
}
async function moveApp(id, dir) {
  const res = await fetch(`/api/apps/${id}/move`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({dir})});
  const json = await res.json(); apps=json.apps; renderCards();
}

function ensureHttps(url) {
  if (!url) return url;
  if (!/^https?:\/\//i.test(url)) return 'https://' + url;
  return url;
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
initEmoji();
initColorPicker();
loadApps();
</script>
