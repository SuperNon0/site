title: Mon Homelab
theme: dark
color: slate
language: fr
headerStyle: boxed
hideVersion: true
# _self = le lien remplace la page actuelle (idéal en PWA sur téléphone,
# le bouton retour ramène au dashboard). _blank = nouvel onglet.
target: _self

layout:
  Administration:
    style: row
    columns: 4
    icon: mdi-server
  Domotique & Réseau:
    style: row
    columns: 4
    icon: mdi-home-automation
  Automatisation:
    style: row
    columns: 4
    icon: mdi-cog-sync
  Médias & Jeux:
    style: row
    columns: 4
    icon: mdi-play-circle
  Outils:
    style: row
    columns: 4
    icon: mdi-toolbox

quicklaunch:
  searchDescriptions: true
  hideInternetSearch: false
  provider: duckduckgo
