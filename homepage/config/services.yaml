# services.yaml — tes outils, d'après tes conteneurs Proxmox.
#
# ⚠️ À COMPLÉTER :
#   • href:  → corrige l'URL réelle (domaine ou IP:port) de chaque service.
#   • description: → remplace "192.168.0.___" par l'IP réelle pour y accéder.
#
# Ajouter un service = copier un bloc. Le retirer = supprimer son bloc.
# Icônes : https://github.com/walkxcode/dashboard-icons  (sinon "mdi-xxx")
# Widgets live : https://gethomepage.dev/widgets/

- Administration:
    - Proxmox:
        icon: proxmox.png
        href: https://proxmox.super-nono.cc/
        description: Hyperviseur pve2 · 192.168.0.___
        # widget:
        #   type: proxmox
        #   url: https://proxmox.super-nono.cc
        #   username: homepage@pam!token
        #   password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN}}"
        #   node: pve2
    - Cloudflare (Debian):
        icon: cloudflare.png
        href: https://one.dash.cloudflare.com/
        description: Tunnel Zero Trust · LXC 100 · 192.168.0.___

- Domotique & Réseau:
    - Home Assistant:
        icon: home-assistant.png
        href: https://home.super-nono.cc/
        description: Domotique · 192.168.0.___
        # widget:
        #   type: homeassistant
        #   url: https://home.super-nono.cc
        #   key: "{{HOMEPAGE_VAR_HASS_TOKEN}}"
    - AdGuard Home:
        icon: adguard-home.png
        href: https://adguard.super-nono.cc/
        description: DNS & filtrage · 192.168.0.___
        widget:
          type: adguard
          url: https://adguard.super-nono.cc
          username: "{{HOMEPAGE_VAR_ADGUARD_USER}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
    - Box / Routeur:
        icon: mdi-router-network
        href: http://192.168.0.254/
        description: Accès réseau local · 192.168.0.254

